{% extends "admin/base_site.html" %}

{% block content %}
  <h1>{{ title }}</h1>
  <p>The same email will be sent separately to {{ users|length }} selected user(s).</p>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    {% for user in users %}
      <input type="hidden" name="_selected_action" value="{{ user.pk }}">
    {% endfor %}
    <input type="hidden" name="action" value="send_follow_up_email">
    <input type="hidden" name="send" value="1">
    <input type="submit" value="Send email" class="default">
    <a href="{% url 'admin:auth_user_changelist' %}" class="button cancel-link">Cancel</a>
  </form>
{% endblock %}
